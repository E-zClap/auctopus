# Auctopus configuration.
# `auctopus init` copies this file into a new project as config.toml. Replace every value that starts with "insert";
# any value that still starts with "insert" counts as unset. `auctopus doctor --online` checks everything.

[project]
name = "auctopus"
runs_dir = "runs"
prompts_dir = "prompts"           # the stage prompts; `auctopus init` copies in templates to fill in
domain_dir = "domain"             # the domain pack: sample card, instrument specification, rules, lab instructions
                                  # (either folder may live outside the project, e.g. to keep prompts private)
log_level = "INFO"
max_history_chars = 900000        # the PI's conversation is compacted (summary + recent turns) beyond this size

[keys]
# The environment variables OPENAI_API_KEY and ANTHROPIC_API_KEY win over these values. Keep real keys out of git:
# config.toml is listed in .gitignore.
openai_api_key = "insert OpenAI API key here"
anthropic_api_key = "insert Anthropic API key here"

# ------------------------------------------------------------------------------------------------ the agents
# provider: "openai" (Responses API) or "anthropic" (Messages API); any role can use either provider.
# effort: reasoning effort; accepted values depend on the provider and model (OpenAI: e.g. low, medium, high, xhigh;
# Anthropic: low, medium, high, xhigh, max). background = true (OpenAI) runs long replies as background responses
# that survive a restart. web_search gives the role the provider's hosted web search (literature checks).
# `auctopus models` lists the exact model names your keys can use.

[roles.proposer]          # fresh proposer instances, one conversation each, never shown each other's proposals
provider = "openai"
model = "insert OpenAI model for the proposers"
effort = "xhigh"
background = true
web_search = true
max_output_tokens = 0     # 0 = the provider's own limit

[roles.dedup]             # groups proposals by central mechanism and keeps one per group
provider = "openai"
model = "insert OpenAI model for deduplication"
effort = "medium"
max_output_tokens = 0

[roles.pi]                # the principal investigator: one persistent conversation for selection, theory, the
provider = "openai"       # manuscript, experiment designs and rulings
model = "insert OpenAI model for the principal investigator"
effort = "high"
background = true
web_search = true
max_output_tokens = 0
timeout_s = 14400

[roles.pi_review]         # the PI's reviews, in the same conversation, possibly at another model or effort
provider = "openai"
model = "insert OpenAI model for the PI's reviews"
effort = "xhigh"
background = true
max_output_tokens = 0
timeout_s = 7200

[roles.feasibility]       # feasibility reviewer for the laboratory test (fresh conversation)
provider = "openai"
model = "insert OpenAI model for the feasibility reviewer"
effort = "xhigh"
background = true
max_output_tokens = 0

[roles.reviewer_gpt]     # independent reviewer: reads only the manuscript
provider = "openai"
model = "insert OpenAI model for the GPT reviewer"
effort = "xhigh"
background = true
web_search = true
max_output_tokens = 0

[roles.reviewer_claude]   # independent reviewer: reads only the manuscript
provider = "anthropic"
model = "claude-opus-5-5"
effort = "high"
web_search = true

[roles.manager]           # revises the proposal search (exclusions) and proposes a design after a laboratory NO-GO
provider = "anthropic"
model = "claude-opus-5-5"
effort = "high"

[roles.safety]            # safety agent: approves or rejects the run packet before anything reaches the instrument
provider = "anthropic"
model = "claude-opus-5-5"
effort = "high"

# ------------------------------------------------------------------------------------------------- proposals
[proposals]
proposers = 10                    # proposers per fresh batch
concurrency = 5                   # proposer requests in flight at once
stagger_s = 2.0
assess_after = 5                  # the PI assesses a batch once 5 proposals of >= refusal_min_words words are in
refusal_min_words = 600           #   (0 = wait for every proposer); the remaining proposers are cancelled
dedup = true
max_batches = 24                  # fresh and revision batches before the run stops
revision = true                   # after a batch without a selection, a revision batch develops the PI's BEST SEED
revision_proposers = 6
selection = "strict"              # "strict": the PI may reject the whole batch; "relaxed": it selects the strongest
relax_after = 12                  # strict only: from batch 12 on, the PI selects the strongest (0 = never relax)
manager_exclusions_after = 6      # after 6 batches in a row without a selection, the manager excludes recurring
                                  # rejected idea families from later fresh batches (0 = never)

# ----------------------------------------------------------------------------------------------------- chain
[chain]
theory_steps = ["02-proofs", "02b-positioning", "03-write", "04-exp"]
review_mode = "once"              # "once": one PI review per experiment, one revision, move on;
max_review_rounds = 5             # "until-accept": repeat reviews, stop after max_review_rounds
final_review_rounds = 2
lab = true                        # test the theory on the instrument
manager_redesign = true           # after a NO-GO, the manager proposes a discriminating design and the PI rules once
lab_reruns = 1                    # repeat a failed or aborted acquisition after the PI's ruling (same criteria)
figures = true
reviewers = ["reviewer_claude", "reviewer_gpt"]
review_max_files = 9
review_max_mb = 18.0

# ------------------------------------------------------------------------- computational researcher (HPC)
[hpc]
transport = "ssh"                                  # "ssh"; "local" makes a local folder play the remote (tests)
host = "insert HPC hostname or ~/.ssh/config alias here"
user = "insert HPC username here"
port = 22
identity_file = "insert path to SSH private key here (or leave as is to use ssh-agent / ~/.ssh/config)"
ssh_options = []                                   # e.g. ["-J", "gateway.example.org"]
remote_root = "insert remote working directory here (e.g. /home/you/auctopus)"
env_file = "~/.auctopus/env"                       # written by `auctopus setup-remote hpc`
path_prepend = "$HOME/.local/bin"
agent = "codex"                                    # Codex CLI (codex exec), run detached
agent_model = "insert Codex model name here"
agent_command = ""                                 # empty = the default command for the agent; placeholders
                                                   # {model_flag} {prompt_file} {model}
job_timeout_h = 24.0
poll_s = 60.0
detach = true
max_pull_mb = 200.0
extra_instructions = ""                            # site notes for the agent: scheduler, modules, GPUs, quotas

# ---------------------------------------------------------------------- experimentalist (instrument computer)
[lab]
transport = "ssh"                                  # "ssh", or "manual" (packets through a shared exchange folder)
host = "insert instrument-computer hostname here"
user = "insert instrument-computer username here"
port = 22
identity_file = "insert path to SSH private key here (or leave as is to use ssh-agent / ~/.ssh/config)"
ssh_options = []
remote_root = "insert lab working directory here (e.g. /home/lab/auctopus-lab)"
env_file = "~/.auctopus/env"                       # written by `auctopus setup-remote lab`
path_prepend = "$HOME/.local/bin"
agent = "claude"                                   # Claude Code in print mode (claude -p), run detached
agent_model = "claude-opus-5-5"
agent_command = ""
job_timeout_h = 72.0
poll_s = 300.0
detach = true
safety_review = true                               # the safety agent must approve the run packet
safety_fix_rounds = 1                              # packet corrections after a safety rejection before the run stops
require_approval = true                            # a person also approves the design (`auctopus approve`)
exchange_dir = "lab-exchange"                      # transport "manual": inbox/ and outbox/ live here

[mock]
scenario = "revision-then-win"                     # used only by `auctopus dry-run`
